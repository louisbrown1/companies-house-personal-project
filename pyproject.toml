[project]
name = "underwriting-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "fastmcp==2.13.1",
    "google-adk==1.25.1",
    "reportlab>=4,<5",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pypdfium2==5.15.0",
    "rapidocr==3.10.0",
    "onnxruntime==1.31.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "starlette>=0.37",
]

[dependency-groups]
browser = [
    "playwright>=1.58,<2",
]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff==0.17.4",
]
gemma = [
    "litellm==1.108.2",
    "hf-xet>=1.6,<2; platform_machine == \"AMD64\" or platform_machine == \"amd64\" or platform_machine == \"x86_64\" or platform_machine == \"arm64\" or platform_machine == \"aarch64\" or platform_machine == \"ARM64\"",
]
mcp = [
    "fastmcp==2.13.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "starlette>=0.37",
]
[tool.uv]
package = false
default-groups = ["dev", "gemma"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agent", "mcp_server", "."]
extend-exclude = [".venv*", ".data", "tmp", "redteam/results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
